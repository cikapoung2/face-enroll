<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ลงทะเบียนใบหน้านักเรียน</title>
<style>
:root{--bg:#f3f6f4;--ink:#17302a;--mut:#5b7168;--pri:#0f766e;--line:#cfdad5;--card:#fff;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
main{max-width:520px;margin:0 auto;padding:20px}
h1{font-size:1.5rem;margin:.4em 0}
p.s{color:var(--mut);margin:0 0 16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card)}
.cam{position:relative;aspect-ratio:4/3;background:#0b1a16;border-radius:12px;overflow:hidden;margin-top:16px}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
button{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid #7dd3c8;outline-offset:2px}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;background:#e6efeb;border-radius:8px;font-size:.92rem}
.consent input{margin-top:5px}
#msg{margin-top:12px;min-height:1.6em}
.err{color:var(--err)}.ok{color:var(--pri);font-weight:600}
#dots{display:flex;gap:6px;margin-top:10px}
#dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
#dots i.on{background:var(--pri)}
</style>
</head>
<body>
<main>
  <h1>ลงทะเบียนใบหน้านักเรียน</h1>
  <p class="s">ระบบจะบันทึกเฉพาะ “ค่าตัวเลขของใบหน้า” ไม่เก็บภาพถ่าย</p>

  <label for="sid">รหัสนักเรียน</label>
  <input id="sid" type="text" autocomplete="off">
  <label for="nm">ชื่อ-นามสกุล</label>
  <input id="nm" type="text" autocomplete="off">
  <label for="cl">ห้อง (เช่น ม.3/2)</label>
  <input id="cl" type="text" autocomplete="off">

  <label class="consent"><input id="ok" type="checkbox">
    <span>ข้าพเจ้า (หรือผู้ปกครองกรณีอายุต่ำกว่า 20 ปี) ยินยอมให้โรงเรียนเก็บข้อมูลใบหน้าเพื่อใช้เช็คชื่อเท่านั้น และขอลบข้อมูลได้ทุกเมื่อ</span></label>

  <div class="cam"><video id="v" autoplay playsinline muted></video><canvas id="c"></canvas></div>
  <div id="dots"><i></i><i></i><i></i></div>
  <button id="go" disabled>กำลังโหลดโมเดล…</button>
  <div id="msg" role="status"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const MODELS='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/';
const $=id=>document.getElementById(id), msg=(t,c)=>{$('msg').textContent=t;$('msg').className=c||''};
const SHOTS=3, got=[];
(async()=>{
  try{
    await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
      faceapi.nets.faceRecognitionNet.loadFromUri(MODELS)]);
    $('v').srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
    $('go').disabled=false;$('go').textContent='ถ่ายภาพ (0/'+SHOTS+')';
  }catch(e){msg('เปิดกล้องหรือโหลดโมเดลไม่สำเร็จ: '+e.message,'err')}
})();

$('go').onclick=async()=>{
  const id=$('sid').value.trim(), name=$('nm').value.trim();
  if(!id||!name) return msg('กรอกรหัสและชื่อก่อน','err');
  if(!$('ok').checked) return msg('ติ๊กยินยอมก่อนเริ่มสแกน','err');
  $('go').disabled=true; msg('กำลังตรวจจับใบหน้า…');
  const r=await faceapi.detectSingleFace($('v'),new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();
  if(!r){$('go').disabled=false;return msg('ไม่พบใบหน้า ลองขยับให้ตรงกล้องและมีแสงพอ','err')}
  got.push(Array.from(r.descriptor));
  document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('on',i<got.length));
  if(got.length<SHOTS){
    $('go').disabled=false;$('go').textContent=`ถ่ายภาพ (${got.length}/${SHOTS})`;
    return msg('ดี! หันหน้าเล็กน้อยแล้วถ่ายอีกครั้ง','ok');
  }
  $('go').textContent='กำลังบันทึก…';
  const res=await fetch('/api/enroll',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({studentId:id,name,classroom:$('cl').value.trim(),descriptors:got,consent:true})});
  const d=await res.json();
  if(d.ok){msg('บันทึกเรียบร้อย ขอบคุณ','ok');$('go').textContent='เสร็จสิ้น'}
  else{msg(d.error||'บันทึกไม่สำเร็จ','err');got.length=0;$('go').disabled=false;$('go').textContent='ถ่ายใหม่'}
};
</script>
</body>
</html>
